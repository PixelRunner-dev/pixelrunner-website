<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7dbbf" />
    <title>Pixel Runner — a programmable LED pixel display</title>
    <meta
      name="description"
      content="Pixel Runner is a programmable 64×32 LED matrix display with a catalog of 1000+ applets. No accounts or subscriptions required. Buy it now!"
    />
    <meta property="og:title" content="Pixel Runner — programmable LED matrix" />
    <meta property="og:description" content="64×32 pixel display, 1000+ applets, no accounts or subscriptions" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/logo-symbol.svg" />
    <script>
      // SPA redirect decoder — pairs with public/404.html (rafgraph/spa-github-pages).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
